name: Deploy static site to GitHub Pages

on:
  push:
    branches: [master]
    paths: ['site/**', 'pipeline/**', 'package.json', 'package-lock.json', '.github/workflows/pages.yml']
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      # Si setup-node@v5 no resolviera, usar @v4 (funciona igual, solo avisa de Node 20).
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Test pipeline
        run: npm test

      - name: Build news data from RSS feeds
        run: node pipeline/build.js site/data

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
