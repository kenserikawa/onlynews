<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>OnlyNews</title>

        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.5.3/dist/css/bootstrap.min.css">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
        <link rel="stylesheet" href="css/custom.css">
        <link rel="icon" href="images/globe.png">
        <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
        <script src="js/onhover-article-animation.js"></script>
    </head>
    <body>
        <div id="content" class="container">
            <nav class="navbar navbar-expand-sm">
                <div class="row w-100">
                    <div class="col-4">
                        <a href="#/" class="text-decoration-none">
                            <div class="bg-danger p-2 text-white border rounded d-inline-block brand">
                                <h1 class="m-0 text-right h4">
                                    ONLY
                                    <span class="bg-white border rounded text-danger pr-1 pl-1 my-auto font-weight-bold">NEWS</span>
                                </h1>
                            </div>
                        </a>
                    </div>
                    <div class="col-8 align-middle my-auto pr-0">
                        <form id="search-form" class="form-inline my-2 float-right">
                            <input class="bg-transparent border-2 border-danger rounded-left p-1" type="text" name="query"
                                placeholder="search by keyword" style="outline:0px !important;" required>
                            <button class="btn-outline-danger text-white bg-danger my-2 my-sm-0 p-1 rounded-right font-weight-bold"
                                type="submit">
                                ↵
                            </button>
                        </form>
                    </div>
                </div>
            </nav>

            <div class="row p-3 d-flex justify-content-center">
                <a href="#/general" id="/general" onmouseover="toggleSelected(this)" onmouseout="undoToggling(this)"
                    class="category-button text-decoration-none rounded-left btn-outline-danger my-2 px-2 py-1 border border-danger">General</a>
                <a href="#/business" id="/business" onmouseover="toggleSelected(this)" onmouseout="undoToggling(this)"
                    class="category-button text-decoration-none btn-outline-danger my-2 px-2 py-1 border border-danger">Business</a>
                <a href="#/entertainment" id="/entertainment" onmouseover="toggleSelected(this)" onmouseout="undoToggling(this)"
                    class="category-button text-decoration-none btn-outline-danger my-2 px-2 py-1 border border-danger">Entertainment</a>
                <a href="#/health" id="/health" onmouseover="toggleSelected(this)" onmouseout="undoToggling(this)"
                    class="category-button text-decoration-none btn-outline-danger my-2 px-2 py-1 border border-danger">Health</a>
                <a href="#/science" id="/science" onmouseover="toggleSelected(this)" onmouseout="undoToggling(this)"
                    class="category-button text-decoration-none btn-outline-danger my-2 px-2 py-1 border border-danger">Science</a>
                <a href="#/sports" id="/sports" onmouseover="toggleSelected(this)" onmouseout="undoToggling(this)"
                    class="category-button text-decoration-none btn-outline-danger my-2 px-2 py-1 border border-danger">Sports</a>
                <a href="#/tech" id="/tech" onmouseover="toggleSelected(this)" onmouseout="undoToggling(this)"
                    class="category-button text-decoration-none rounded-right btn-outline-danger my-2 px-2 py-1 border border-danger">Technology</a>
            </div>

            <p id="status" class="text-center text-muted small"></p>
            <main id="results"></main>
        </div>
        <div id="svg"></div>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/d3/4.13.0/d3.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.3/dist/js/bootstrap.bundle.min.js"></script>
        <script src="js/button-animation.js"></script>
        <script src="js/background-svg.js"></script>
        <script src="js/remove-card-animation.js"></script>
        <script src="js/app.js"></script>
    </body>
</html>
