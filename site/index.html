<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>OnlyNews</title>
    <meta name="description" content="Las mismas noticias, contadas por todos los medios: compara cómo las cubren izquierda, centro y derecha.">
    <meta name="color-scheme" content="light dark">
    <link rel="icon" href="icon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Space+Mono:wght@400;700&family=Work+Sans:wght@400;500;600&display=swap">
    <link rel="stylesheet" href="css/styles.css">
    <script>
        try {
            const theme = JSON.parse(localStorage.getItem('onlynews:theme'));
            if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme;
        } catch { /* tema automático */ }
    </script>
    <script type="module" src="js/main.js"></script>
</head>
<body>
    <a class="skip-link" href="#app">Saltar al contenido</a>
    <header class="site-header">
        <div class="wrap header-inner">
            <a class="brand" href="#/" aria-label="OnlyNews, portada">
                <span class="brand-word">ONLYNEWS</span>
                <span class="brand-stripe" aria-hidden="true"><span></span><span></span><span></span></span>
                <span class="brand-sticker" aria-hidden="true">😜</span>
            </a>
            <nav class="market-tabs" aria-label="Edición">
                <a href="#/es" data-market="es">España</a>
                <a href="#/intl" data-market="intl">Internacional</a>
            </nav>
            <form class="search" role="search">
                <label class="visually-hidden" for="q">Buscar historias</label>
                <input id="q" name="q" type="search" placeholder="Buscar…" autocomplete="off">
            </form>
            <div class="header-actions">
                <button type="button" class="satire-toggle" id="satire-toggle" aria-pressed="false" aria-label="Modo satírico" title="Activar modo satírico">😜</button>
                <button type="button" class="icon-btn" id="theme-toggle"></button>
                <a class="icon-btn" href="#/fuentes" aria-label="Medios y ajustes" title="Medios y ajustes"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg></a>
            </div>
        </div>
    </header>
    <p class="tagline" id="tagline" hidden></p>
    <div id="monitor" class="monitor" aria-label="Resumen de cobertura de la edición" hidden></div>
    <main id="app" class="wrap" tabindex="-1"></main>
    <footer class="site-footer">
        <div class="wrap">
            <p id="feed-status"></p>
            <p><a href="#/fuentes">Cómo clasificamos los medios</a> · Clasificación orientativa · <a href="https://github.com/kenserikawa/onlynews">Código</a></p>
        </div>
    </footer>
</body>
</html>
